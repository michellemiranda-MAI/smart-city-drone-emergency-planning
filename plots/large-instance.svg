<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <!-- Large instance (Tarragona chemical emergency): location graph with edge
       costs, depots, chargers, mission sites, drone starts and unlock
       dependencies. Light colours, for the report. -->
  <style>
    .bg { fill: #ffffff; }
    .sea { fill: #dceaf3; }
    .river { stroke: #9cc3dc; stroke-width: 10; fill: none; stroke-linecap: round; }
    .edge { stroke: #a3aeaa; stroke-width: 2.5; fill: none; }
    .wbg { fill: #ffffff; stroke: #a3aeaa; stroke-width: 1.5; }
    .w { font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #1c2421; }
    .lbl { font-size: 15px; font-weight: 700; fill: #1c2421; }
    .sub { font-size: 12.5px; fill: #5d6a65; }
    .region { font-size: 12.5px; letter-spacing: 0.14em; fill: #5d6a65; }
    .water { font-size: 12.5px; font-style: italic; fill: #4f86ad; }
    .node { fill: #ffffff; stroke-width: 3.5; }
    .depot { stroke: #2f5d9e; }
    .charger { stroke: #237347; }
    .mission { stroke: #b8561a; }
    .locked { stroke: #b3261e; stroke-width: 3; stroke-dasharray: 6 5; }
    .f-depot { fill: #2f5d9e; }
    .f-charger { fill: #237347; }
    .f-mission { fill: #b8561a; }
    .f-locked { fill: #b3261e; }
    .s-mission { stroke: #b8561a; }
    .s-locked { stroke: #b3261e; }
    .t-mission { fill: #b8561a; }
    .t-locked { fill: #b3261e; }
    .dep { stroke: #b3261e; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .badge { fill: #1c2421; }
    .badge-t { fill: #ffffff; font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="770"/>

  <!-- sea and river -->
  <path class="sea" d="M0 640 C 200 628, 420 652, 620 638 S 860 630, 960 642 L 960 690 L 0 690 Z"/>
  <text class="water" x="700" y="672">Mediterranean</text>
  <path class="river" d="M300 0 C 280 150, 362 262, 330 420 S 300 580, 340 645"/>
  <text class="water" x="312" y="34">riu Francolí</text>

  <!-- region labels -->
  <text class="region" x="20" y="34">WEST BANK</text>
  <text class="region" x="440" y="34">NORTH</text>
  <text class="region" x="660" y="618">CITY CENTRE</text>

  <!-- edges -->
  <line class="edge" x1="230" y1="540" x2="90" y2="560"/>
  <line class="edge" x1="230" y1="540" x2="150" y2="360"/>
  <line class="edge" x1="90" y1="560" x2="150" y2="360"/>
  <line class="edge" x1="150" y1="360" x2="110" y2="190"/>
  <line class="edge" x1="230" y1="540" x2="330" y2="420"/>
  <line class="edge" x1="330" y1="420" x2="470" y2="500"/>
  <line class="edge" x1="390" y1="250" x2="330" y2="420"/>
  <line class="edge" x1="470" y1="500" x2="620" y2="420"/>
  <line class="edge" x1="620" y1="420" x2="780" y2="520"/>
  <line class="edge" x1="780" y1="520" x2="800" y2="340"/>
  <line class="edge" x1="620" y1="420" x2="800" y2="340"/>
  <line class="edge" x1="620" y1="420" x2="560" y2="200"/>
  <line class="edge" x1="560" y1="200" x2="390" y2="250"/>
  <line class="edge" x1="560" y1="200" x2="640" y2="70"/>
  <path class="edge" d="M150 360 Q 300 110 560 200"/>

  <!-- unlock dependencies -->
  <path class="dep" d="M128 345 Q 52 280 94 212"/>
  <polygon class="f-locked" points="94,212 89,228 102,222"/>
  <text class="sub t-locked" x="14" y="284">comm1</text>
  <text class="sub t-locked" x="14" y="300">opens it</text>
  <path class="dep" d="M803 506 Q 878 432 820 357"/>
  <polygon class="f-locked" points="820,357 822,374 832,364"/>
  <text class="sub t-locked" x="862" y="430">inspected</text>
  <text class="sub t-locked" x="862" y="446">opens it</text>

  <!-- edge weights (flight cost = distance) -->
  <circle class="wbg" cx="160" cy="550" r="12"/><text class="w" x="160" y="554.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="190" cy="450" r="12"/><text class="w" x="190" y="454.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="120" cy="460" r="12"/><text class="w" x="120" y="464.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="130" cy="275" r="12"/><text class="w" x="130" y="279.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="280" cy="480" r="12"/><text class="w" x="280" y="484.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="400" cy="460" r="12"/><text class="w" x="400" y="464.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="360" cy="335" r="12"/><text class="w" x="360" y="339.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="545" cy="460" r="12"/><text class="w" x="545" y="464.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="700" cy="470" r="12"/><text class="w" x="700" y="474.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="790" cy="430" r="12"/><text class="w" x="790" y="434.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="710" cy="380" r="12"/><text class="w" x="710" y="384.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="590" cy="310" r="12"/><text class="w" x="590" y="314.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="475" cy="225" r="12"/><text class="w" x="475" y="229.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="600" cy="135" r="12"/><text class="w" x="600" y="139.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="328" cy="195" r="12"/><text class="w" x="328" y="199.5" text-anchor="middle">3</text>

  <!-- port (depot) -->
  <rect class="node depot" x="209" y="519" width="42" height="42" rx="6"/>
  <rect class="f-depot" x="221" y="531" width="18" height="18" rx="2"/>
  <text class="lbl" x="230" y="584" text-anchor="middle">port</text>
  <text class="sub" x="230" y="600" text-anchor="middle">comm1 · water1</text>

  <!-- serrallo (delivery) -->
  <circle class="node mission" cx="90" cy="560" r="21"/>
  <path class="s-mission" d="M90 550 v20 M80 560 h20" stroke-width="5"/>
  <text class="lbl" x="90" y="604" text-anchor="middle">serrallo</text>
  <text class="sub t-mission" x="90" y="620" text-anchor="middle">needs water1</text>

  <!-- bonavista (charger AND delivery) -->
  <circle class="node charger" cx="150" cy="360" r="23"/>
  <circle class="node mission" cx="150" cy="360" r="15" stroke-width="2.5"/>
  <path class="s-mission" d="M150 353 v14 M143 360 h14" stroke-width="4"/>
  <text class="lbl" x="182" y="356">bonavista</text>
  <text class="sub" x="182" y="372">charger · needs comm1</text>

  <!-- petrochem (locked, inspect) -->
  <circle class="node locked" cx="110" cy="190" r="21"/>
  <rect class="f-locked" x="102" y="189" width="16" height="12" rx="2"/>
  <path class="s-locked" d="M105 189 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke-width="2.5"/>
  <text class="lbl" x="140" y="186">petrochem</text>
  <text class="sub t-locked" x="140" y="202">locked · inspect</text>

  <!-- francoli bridge (inspect) -->
  <circle class="node mission" cx="330" cy="420" r="21"/>
  <polygon points="330,409 340,428 320,428" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="298" y="410" text-anchor="end">francoli</text>
  <text class="sub t-mission" x="298" y="426" text-anchor="end">bridge · inspect</text>

  <!-- hospital (delivery) -->
  <circle class="node mission" cx="390" cy="250" r="21"/>
  <path class="s-mission" d="M390 240 v20 M380 250 h20" stroke-width="5"/>
  <text class="lbl" x="420" y="268">hospital</text>
  <text class="sub t-mission" x="420" y="284">needs kit2</text>

  <!-- campus (charger) -->
  <circle class="node charger" cx="560" cy="200" r="21"/>
  <polygon class="f-charger" points="564,186 552,203 560,203 556,215 568,197 560,197"/>
  <text class="lbl" x="592" y="206">campus</text>
  <text class="sub" x="592" y="222">URV · charger</text>

  <!-- pont del diable (inspect) -->
  <circle class="node mission" cx="640" cy="70" r="21"/>
  <polygon points="640,59 650,78 630,78" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="672" y="68">pont_diable</text>
  <text class="sub t-mission" x="672" y="84">aqueduct · inspect</text>

  <!-- estacio (depot) -->
  <rect class="node depot" x="449" y="479" width="42" height="42" rx="6"/>
  <rect class="f-depot" x="461" y="491" width="18" height="18" rx="2"/>
  <text class="lbl" x="470" y="544" text-anchor="middle">estacio</text>
  <text class="sub" x="470" y="560" text-anchor="middle">kit1 · kit2</text>

  <!-- rambla (charger) -->
  <circle class="node charger" cx="620" cy="420" r="21"/>
  <polygon class="f-charger" points="624,406 612,423 620,423 616,435 628,417 620,417"/>
  <text class="lbl" x="660" y="402" text-anchor="start">rambla</text>
  <text class="sub" x="660" y="418">charger</text>

  <!-- amfiteatre (inspect) -->
  <circle class="node mission" cx="780" cy="520" r="21"/>
  <polygon points="780,509 790,528 770,528" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="780" y="564" text-anchor="middle">amfiteatre</text>
  <text class="sub t-mission" x="780" y="580" text-anchor="middle">Roman · inspect</text>

  <!-- part alta (locked, delivery) -->
  <circle class="node locked" cx="800" cy="340" r="21"/>
  <rect class="f-locked" x="792" y="339" width="16" height="12" rx="2"/>
  <path class="s-locked" d="M795 339 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke-width="2.5"/>
  <text class="lbl" x="832" y="336">part_alta</text>
  <text class="sub t-locked" x="832" y="352">locked · kit1</text>

  <!-- drone start badges (all start at b6) -->
  <rect class="badge" x="262" y="548" width="58" height="26" rx="5"/>
  <text class="badge-t" x="291" y="566" text-anchor="middle">A b6</text>
  <rect class="badge" x="582" y="448" width="58" height="26" rx="5"/>
  <text class="badge-t" x="611" y="466" text-anchor="middle">B b6</text>
  <rect class="badge" x="490" y="146" width="58" height="26" rx="5"/>
  <text class="badge-t" x="519" y="164" text-anchor="middle">C b6</text>

  <!-- legend -->
  <g transform="translate(60,718)">
    <rect class="node depot" x="3" y="-11" width="22" height="22" rx="4" style="stroke-width:2.5"/>
    <rect class="f-depot" x="9" y="-5" width="10" height="10" rx="1"/>
    <text class="sub" x="38" y="4.5">depot (supplies start here)</text>

    <circle class="node charger" cx="224" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon class="f-charger" points="226,-8 219,2 224,2 222,9 229,-1 224,-1"/>
    <text class="sub" x="248" y="4.5">charging station</text>

    <circle class="node mission" cx="434" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon points="434,-6 440,5 428,5" fill="none" class="s-mission" stroke-width="2"/>
    <text class="sub" x="458" y="4.5">inspection site</text>

    <circle class="node mission" cx="644" cy="0" r="11" style="stroke-width:2.5"/>
    <path class="s-mission" d="M644 -6 v12 M638 0 h12" stroke-width="3"/>
    <text class="sub" x="668" y="4.5">delivery site (needs supply)</text>

    <circle class="node locked" cx="14" cy="34" r="11" style="stroke-width:2"/>
    <rect class="f-locked" x="10" y="34" width="8" height="6" rx="1"/>
    <path class="s-locked" d="M11.5 34 v-3 a2.5 2.5 0 0 1 5 0 v3" fill="none" stroke-width="1.5"/>
    <text class="sub" x="38" y="38.5">locked at the start</text>

    <path class="dep" d="M210 34 h24"/>
    <polygon class="f-locked" points="240,34 230,29 230,39"/>
    <text class="sub" x="248" y="38.5">unlocks a locked site</text>

    <line class="edge" x1="418" y1="34" x2="450" y2="34"/>
    <circle class="wbg" cx="434" cy="34" r="10"/><text class="w" x="434" y="38.5" text-anchor="middle">2</text>
    <text class="sub" x="458" y="38.5">flight cost = distance</text>

    <rect class="badge" x="622" y="23" width="44" height="22" rx="4"/>
    <text class="badge-t" x="644" y="38.5" text-anchor="middle">A b6</text>
    <text class="sub" x="676" y="38.5">drone start, battery</text>
  </g>
</svg>
