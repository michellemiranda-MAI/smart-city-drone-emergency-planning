<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 1000 682" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <!-- Medium instance (Barcelona storm surge): location graph with edge
       costs, depot, chargers, mission sites, drone starts and unlock
       dependency. Same style as large-instance.svg, for the report. -->
  <style>
    .bg { fill: #ffffff; }
    .sea { fill: #dceaf3; }
    .river { stroke: #9cc3dc; stroke-width: 10; fill: none; stroke-linecap: round; }
    .edge { stroke: #a3aeaa; stroke-width: 2.5; fill: none; }
    .wbg { fill: #ffffff; stroke: #a3aeaa; stroke-width: 1.5; }
    .w { font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #1c2421; }
    .lbl { font-size: 15px; font-weight: 700; fill: #1c2421; }
    .sub { font-size: 12.5px; fill: #5d6a65; }
    .region { font-size: 12.5px; letter-spacing: 0.14em; fill: #5d6a65; }
    .water { font-size: 12.5px; font-style: italic; fill: #4f86ad; }
    .node { fill: #ffffff; stroke-width: 3.5; }
    .depot { stroke: #2f5d9e; }
    .charger { stroke: #237347; }
    .mission { stroke: #b8561a; }
    .locked { stroke: #b3261e; stroke-width: 3; stroke-dasharray: 6 5; }
    .f-depot { fill: #2f5d9e; }
    .f-charger { fill: #237347; }
    .f-mission { fill: #b8561a; }
    .f-locked { fill: #b3261e; }
    .s-mission { stroke: #b8561a; }
    .s-locked { stroke: #b3261e; }
    .t-mission { fill: #b8561a; }
    .t-locked { fill: #b3261e; }
    .dep { stroke: #b3261e; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .badge { fill: #1c2421; }
    .badge-t { fill: #ffffff; font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="762"/>

  <!-- sea -->
  <path class="sea" d="M0 622 C 200 610, 420 634, 620 620 S 860 612, 1000 624 L 1000 660 L 0 660 Z"/>
  <text class="water" x="760" y="648">Mediterranean</text>

  <!-- river Besòs (north-east, next to besos_delta) -->
  <path class="river" d="M950 80 C 935 260, 995 430, 988 622"/>
  <text class="water" x="880" y="134">riu Besòs</text>

  <!-- region labels -->
  <text class="region" x="20" y="108">PORT · MONTJUÏC</text>
  <text class="region" x="500" y="108">EIXAMPLE</text>
  <text class="region" x="760" y="108">SANT MARTÍ</text>
  <text class="region" x="330" y="108">CIUTAT VELLA</text>

  <!-- edges -->
  <line class="edge" x1="250" y1="430" x2="100" y2="520"/>
  <line class="edge" x1="250" y1="430" x2="400" y2="520"/>
  <line class="edge" x1="100" y1="520" x2="400" y2="520"/>
  <line class="edge" x1="250" y1="430" x2="520" y2="200"/>
  <line class="edge" x1="400" y1="520" x2="560" y2="470"/>
  <line class="edge" x1="560" y1="470" x2="520" y2="200"/>
  <line class="edge" x1="560" y1="470" x2="700" y2="360"/>
  <line class="edge" x1="520" y1="200" x2="700" y2="360"/>
  <line class="edge" x1="520" y1="200" x2="870" y2="210"/>
  <line class="edge" x1="700" y1="360" x2="920" y2="520"/>
  <line class="edge" x1="700" y1="360" x2="870" y2="210"/>
  <line class="edge" x1="920" y1="520" x2="870" y2="210"/>

  <!-- unlock dependency -->
  <path class="dep" d="M700 337 Q 740 240 846 224"/>
  <polygon class="f-locked" points="848,223 835,231 833,219"/>
  <text class="sub t-locked" x="650" y="236">inspected</text>
  <text class="sub t-locked" x="650" y="252">opens it</text>

  <!-- edge weights (flight cost = distance) -->
  <circle class="wbg" cx="175" cy="475" r="12"/><text class="w" x="175" y="479.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="325" cy="475" r="12"/><text class="w" x="325" y="479.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="250" cy="520" r="12"/><text class="w" x="250" y="524.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="385" cy="315" r="12"/><text class="w" x="385" y="319.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="480" cy="495" r="12"/><text class="w" x="480" y="499.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="540" cy="335" r="12"/><text class="w" x="540" y="339.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="630" cy="415" r="12"/><text class="w" x="630" y="419.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="610" cy="280" r="12"/><text class="w" x="610" y="284.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="695" cy="205" r="12"/><text class="w" x="695" y="209.5" text-anchor="middle">2</text>
  <circle class="wbg" cx="810" cy="440" r="12"/><text class="w" x="810" y="444.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="785" cy="285" r="12"/><text class="w" x="785" y="289.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="895" cy="365" r="12"/><text class="w" x="895" y="369.5" text-anchor="middle">1</text>

  <!-- port_depot (depot, all supplies) -->
  <rect class="node depot" x="229" y="409" width="42" height="42" rx="6"/>
  <rect class="f-depot" x="241" y="421" width="18" height="18" rx="2"/>
  <text class="lbl" x="220" y="410" text-anchor="end">port_depot</text>
  <text class="sub" x="220" y="426" text-anchor="end">kit1 · water1 · comm1</text>

  <!-- montjuic_pad (charger) -->
  <circle class="node charger" cx="100" cy="520" r="21"/>
  <polygon class="f-charger" points="104,506 92,523 100,523 96,535 108,517 100,517"/>
  <text class="lbl" x="100" y="566" text-anchor="middle">montjuic_pad</text>
  <text class="sub" x="100" y="582" text-anchor="middle">charger</text>

  <!-- barceloneta (inspect) -->
  <circle class="node mission" cx="400" cy="520" r="21"/>
  <polygon points="400,509 410,528 390,528" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="400" y="566" text-anchor="middle">barceloneta</text>
  <text class="sub t-mission" x="400" y="582" text-anchor="middle">inspect</text>

  <!-- hospital_mar (inspect AND delivery) -->
  <circle class="node mission" cx="560" cy="470" r="21"/>
  <polygon points="554,461 562,477 546,477" fill="none" class="s-mission" stroke-width="2.5"/>
  <path class="s-mission" d="M568 463 v14 M561 470 h14" stroke-width="4"/>
  <text class="lbl" x="560" y="516" text-anchor="middle">hospital_mar</text>
  <text class="sub t-mission" x="560" y="532" text-anchor="middle">inspect · needs kit1</text>

  <!-- glories_tower (charger) -->
  <circle class="node charger" cx="520" cy="200" r="21"/>
  <polygon class="f-charger" points="524,186 512,203 520,203 516,215 528,197 520,197"/>
  <text class="lbl" x="520" y="152" text-anchor="middle">glories_tower</text>
  <text class="sub" x="520" y="168" text-anchor="middle">charger</text>

  <!-- poblenou (inspect AND delivery) -->
  <circle class="node mission" cx="700" cy="360" r="21"/>
  <polygon points="694,351 702,367 686,367" fill="none" class="s-mission" stroke-width="2.5"/>
  <path class="s-mission" d="M708 353 v14 M701 360 h14" stroke-width="4"/>
  <text class="lbl" x="732" y="358">poblenou</text>
  <text class="sub t-mission" x="732" y="374">inspect · needs water1</text>

  <!-- forum_shelter (delivery) -->
  <circle class="node mission" cx="920" cy="520" r="21"/>
  <path class="s-mission" d="M920 510 v20 M910 520 h20" stroke-width="5"/>
  <text class="lbl" x="920" y="566" text-anchor="middle">forum_shelter</text>
  <text class="sub t-mission" x="920" y="582" text-anchor="middle">needs comm1</text>

  <!-- besos_delta (locked, inspect) -->
  <circle class="node locked" cx="870" cy="210" r="21"/>
  <rect class="f-locked" x="862" y="209" width="16" height="12" rx="2"/>
  <path class="s-locked" d="M865 209 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke-width="2.5"/>
  <text class="lbl" x="870" y="162" text-anchor="middle">besos_delta</text>
  <text class="sub t-locked" x="870" y="178" text-anchor="middle">locked · inspect</text>

  <!-- drone start badges (capacity b6) -->
  <rect class="badge" x="221" y="460" width="58" height="26" rx="5"/>
  <text class="badge-t" x="250" y="478" text-anchor="middle">A b5</text>
  <rect class="badge" x="434" y="187" width="58" height="26" rx="5"/>
  <text class="badge-t" x="463" y="205" text-anchor="middle">B b4</text>

  <!-- legend -->
  <g transform="translate(80,688)">
    <rect x="-14" y="-24" width="866" height="82" rx="8" fill="#fafbfa" stroke="#d5dcd9" stroke-width="1.5"/>
    <rect class="node depot" x="3" y="-11" width="22" height="22" rx="4" style="stroke-width:2.5"/>
    <rect class="f-depot" x="9" y="-5" width="10" height="10" rx="1"/>
    <text class="sub" x="38" y="4.5">depot (supplies start here)</text>

    <circle class="node charger" cx="224" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon class="f-charger" points="226,-8 219,2 224,2 222,9 229,-1 224,-1"/>
    <text class="sub" x="248" y="4.5">charging station</text>

    <circle class="node mission" cx="434" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon points="434,-6 440,5 428,5" fill="none" class="s-mission" stroke-width="2"/>
    <text class="sub" x="458" y="4.5">inspection site</text>

    <circle class="node mission" cx="644" cy="0" r="11" style="stroke-width:2.5"/>
    <path class="s-mission" d="M644 -6 v12 M638 0 h12" stroke-width="3"/>
    <text class="sub" x="668" y="4.5">delivery site (needs supply)</text>

    <circle class="node locked" cx="14" cy="34" r="11" style="stroke-width:2"/>
    <rect class="f-locked" x="10" y="34" width="8" height="6" rx="1"/>
    <path class="s-locked" d="M11.5 34 v-3 a2.5 2.5 0 0 1 5 0 v3" fill="none" stroke-width="1.5"/>
    <text class="sub" x="38" y="38.5">locked at the start</text>

    <path class="dep" d="M210 34 h24"/>
    <polygon class="f-locked" points="240,34 230,29 230,39"/>
    <text class="sub" x="248" y="38.5">unlocks a locked site</text>

    <line class="edge" x1="418" y1="34" x2="450" y2="34"/>
    <circle class="wbg" cx="434" cy="34" r="10"/><text class="w" x="434" y="38.5" text-anchor="middle">2</text>
    <text class="sub" x="458" y="38.5">flight cost = distance</text>

    <rect class="badge" x="622" y="23" width="44" height="22" rx="4"/>
    <text class="badge-t" x="644" y="38.5" text-anchor="middle">A b6</text>
    <text class="sub" x="676" y="38.5">drone start, battery</text>
  </g>
</svg>
