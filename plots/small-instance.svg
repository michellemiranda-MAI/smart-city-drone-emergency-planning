<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 880 450" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <!-- Small instance (Barcelona flood): location graph with edge costs,
       depot, charger, mission sites, drone start and unlock dependency.
       The map is a line, so the drone must go to one end and back.
       Same style as large-instance.svg, for the report. -->
  <style>
    .bg { fill: #ffffff; }
    .sea { fill: #dceaf3; }
    .river { stroke: #9cc3dc; stroke-width: 10; fill: none; stroke-linecap: round; }
    .edge { stroke: #a3aeaa; stroke-width: 2.5; fill: none; }
    .wbg { fill: #ffffff; stroke: #a3aeaa; stroke-width: 1.5; }
    .w { font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #1c2421; }
    .lbl { font-size: 15px; font-weight: 700; fill: #1c2421; }
    .sub { font-size: 12.5px; fill: #5d6a65; }
    .region { font-size: 12.5px; letter-spacing: 0.14em; fill: #5d6a65; }
    .water { font-size: 12.5px; font-style: italic; fill: #4f86ad; }
    .node { fill: #ffffff; stroke-width: 3.5; }
    .depot { stroke: #2f5d9e; }
    .charger { stroke: #237347; }
    .mission { stroke: #b8561a; }
    .locked { stroke: #b3261e; stroke-width: 3; stroke-dasharray: 6 5; }
    .f-depot { fill: #2f5d9e; }
    .f-charger { fill: #237347; }
    .f-mission { fill: #b8561a; }
    .f-locked { fill: #b3261e; }
    .s-mission { stroke: #b8561a; }
    .s-locked { stroke: #b3261e; }
    .t-mission { fill: #b8561a; }
    .t-locked { fill: #b3261e; }
    .dep { stroke: #b3261e; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .badge { fill: #1c2421; }
    .badge-t { fill: #ffffff; font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="880" height="560"/>

  <!-- sea -->
  <path class="sea" d="M0 450 C 180 440, 400 460, 600 448 S 790 442, 880 452 L 880 480 L 0 480 Z"/>
  <text class="water" x="740" y="472">Mediterranean</text>

  <!-- region labels -->
  <text class="region" x="20" y="136">EL PRAT</text>
  <text class="region" x="700" y="136">MONTJUÏC</text>
  <text class="region" x="660" y="432">WATERFRONT</text>

  <!-- edges (all flight costs 1): hospital_mar - aerodrome - barceloneta - montjuic_pad - ciutadella -->
  <line class="edge" x1="90" y1="300" x2="250" y2="200"/>
  <line class="edge" x1="250" y1="200" x2="420" y2="300"/>
  <line class="edge" x1="420" y1="300" x2="580" y2="170"/>
  <line class="edge" x1="580" y1="170" x2="720" y2="320"/>

  <!-- unlock dependency -->
  <path class="dep" d="M440 318 Q 580 420 698 338"/>
  <polygon class="f-locked" points="698,338 690,351 684,341"/>
  <text class="sub t-locked" x="540" y="408">inspected</text>
  <text class="sub t-locked" x="540" y="424">opens it</text>

  <!-- edge weights (flight cost = distance) -->
  <circle class="wbg" cx="170" cy="250" r="12"/><text class="w" x="170" y="254.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="335" cy="250" r="12"/><text class="w" x="335" y="254.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="500" cy="235" r="12"/><text class="w" x="500" y="239.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="650" cy="245" r="12"/><text class="w" x="650" y="249.5" text-anchor="middle">1</text>

  <!-- aerodrome (depot, kit1 here) -->
  <rect class="node depot" x="229" y="179" width="42" height="42" rx="6"/>
  <rect class="f-depot" x="241" y="191" width="18" height="18" rx="2"/>
  <text class="lbl" x="250" y="150" text-anchor="middle">aerodrome</text>
  <text class="sub" x="250" y="166" text-anchor="middle">depot · kit1</text>

  <!-- hospital_mar (delivery) -->
  <circle class="node mission" cx="90" cy="300" r="21"/>
  <path class="s-mission" d="M90 290 v20 M80 300 h20" stroke-width="5"/>
  <text class="lbl" x="90" y="346" text-anchor="middle">hospital_mar</text>
  <text class="sub t-mission" x="90" y="362" text-anchor="middle">needs kit1</text>

  <!-- barceloneta (inspect) -->
  <circle class="node mission" cx="420" cy="300" r="21"/>
  <polygon points="420,289 430,308 410,308" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="405" y="346" text-anchor="end">barceloneta</text>
  <text class="sub t-mission" x="405" y="362" text-anchor="end">inspect</text>

  <!-- montjuic_pad (charger) -->
  <circle class="node charger" cx="580" cy="170" r="21"/>
  <polygon class="f-charger" points="584,156 572,173 580,173 576,185 588,167 580,167"/>
  <text class="lbl" x="580" y="128" text-anchor="middle">montjuic_pad</text>
  <text class="sub" x="580" y="144" text-anchor="middle">charger</text>

  <!-- ciutadella (locked, inspect) -->
  <circle class="node locked" cx="720" cy="320" r="21"/>
  <rect class="f-locked" x="712" y="319" width="16" height="12" rx="2"/>
  <path class="s-locked" d="M715 319 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke-width="2.5"/>
  <text class="lbl" x="752" y="316">ciutadella</text>
  <text class="sub t-locked" x="752" y="332">locked · inspect</text>

  <!-- drone start badge (capacity b4, starts full) -->
  <rect class="badge" x="292" y="150" width="58" height="26" rx="5"/>
  <text class="badge-t" x="321" y="168" text-anchor="middle">A b4</text>

  <!-- legend -->
  <g transform="translate(25,508)">
    <rect class="node depot" x="3" y="-11" width="22" height="22" rx="4" style="stroke-width:2.5"/>
    <rect class="f-depot" x="9" y="-5" width="10" height="10" rx="1"/>
    <text class="sub" x="38" y="4.5">depot (supplies start here)</text>

    <circle class="node charger" cx="224" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon class="f-charger" points="226,-8 219,2 224,2 222,9 229,-1 224,-1"/>
    <text class="sub" x="248" y="4.5">charging station</text>

    <circle class="node mission" cx="434" cy="0" r="11" style="stroke-width:2.5"/>
    <polygon points="434,-6 440,5 428,5" fill="none" class="s-mission" stroke-width="2"/>
    <text class="sub" x="458" y="4.5">inspection site</text>

    <circle class="node mission" cx="644" cy="0" r="11" style="stroke-width:2.5"/>
    <path class="s-mission" d="M644 -6 v12 M638 0 h12" stroke-width="3"/>
    <text class="sub" x="668" y="4.5">delivery site (needs supply)</text>

    <circle class="node locked" cx="14" cy="34" r="11" style="stroke-width:2"/>
    <rect class="f-locked" x="10" y="34" width="8" height="6" rx="1"/>
    <path class="s-locked" d="M11.5 34 v-3 a2.5 2.5 0 0 1 5 0 v3" fill="none" stroke-width="1.5"/>
    <text class="sub" x="38" y="38.5">locked at the start</text>

    <path class="dep" d="M210 34 h24"/>
    <polygon class="f-locked" points="240,34 230,29 230,39"/>
    <text class="sub" x="248" y="38.5">unlocks a locked site</text>

    <line class="edge" x1="418" y1="34" x2="450" y2="34"/>
    <circle class="wbg" cx="434" cy="34" r="10"/><text class="w" x="434" y="38.5" text-anchor="middle">2</text>
    <text class="sub" x="458" y="38.5">flight cost = distance</text>

    <rect class="badge" x="622" y="23" width="44" height="22" rx="4"/>
    <text class="badge-t" x="644" y="38.5" text-anchor="middle">A b4</text>
    <text class="sub" x="676" y="38.5">drone start, battery</text>
  </g>
</svg>
