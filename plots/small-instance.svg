<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1258 412" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
  <!-- Small instance (Barcelona flood): location graph with edge costs,
       depot, charger, mission sites, drone start and unlock dependency.
       West to east: Viladecans | Llobregat | El Prat, then Barceloneta,
       Montjuic and Ciutadella. The map is a line, so the drone must go to
       one end and back. Same style as large-instance.svg, for the report. -->
  <style>
    .bg { fill: #ffffff; }
    .sea { fill: #dceaf3; }
    .river { stroke: #9cc3dc; stroke-width: 10; fill: none; stroke-linecap: round; }
    .edge { stroke: #a3aeaa; stroke-width: 2.5; fill: none; }
    .wbg { fill: #ffffff; stroke: #a3aeaa; stroke-width: 1.5; }
    .w { font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #1c2421; }
    .lbl { font-size: 15px; font-weight: 700; fill: #1c2421; }
    .sub { font-size: 12.5px; fill: #5d6a65; }
    .region { font-size: 12.5px; letter-spacing: 0.14em; fill: #5d6a65; }
    .water { font-size: 12.5px; font-style: italic; fill: #4f86ad; }
    .node { fill: #ffffff; stroke-width: 3.5; }
    .depot { stroke: #2f5d9e; }
    .charger { stroke: #237347; }
    .mission { stroke: #b8561a; }
    .locked { stroke: #b3261e; stroke-width: 3; stroke-dasharray: 6 5; }
    .f-depot { fill: #2f5d9e; }
    .f-charger { fill: #237347; }
    .f-mission { fill: #b8561a; }
    .f-locked { fill: #b3261e; }
    .s-mission { stroke: #b8561a; }
    .s-locked { stroke: #b3261e; }
    .t-mission { fill: #b8561a; }
    .t-locked { fill: #b3261e; }
    .dep { stroke: #b3261e; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    .badge { fill: #1c2421; }
    .badge-t { fill: #ffffff; font-family: JetBrains Mono, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  </style>

  <rect class="bg" x="0" y="0" width="1258" height="582"/>

  <!-- sea -->
  <path class="sea" d="M0 450 C 180 440, 400 460, 600 448 S 790 442, 880 452 L 880 480 L 0 480 Z"/>
  <text class="water" x="740" y="472">Mediterranean</text>

  <!-- river Llobregat (between Viladecans and El Prat) -->
  <path class="river" d="M192 112 C 168 220, 210 330, 182 452"/>
  <text class="water" x="204" y="132">riu Llobregat</text>

  <!-- region labels -->
  <text class="region" x="20" y="98">VILADECANS</text>
  <text class="region" x="230" y="98">EL PRAT</text>
  <text class="region" x="420" y="98">MONTJUÏC</text>
  <text class="region" x="640" y="98">CIUTAT VELLA</text>

  <!-- edges (all flight costs 1): hospital_viladecans - aerodrome - barceloneta - montjuic_pad - ciutadella -->
  <line class="edge" x1="90" y1="330" x2="300" y2="330"/>
  <path class="edge" d="M300 330 Q 450 410 600 360"/>
  <line class="edge" x1="600" y1="360" x2="470" y2="170"/>
  <line class="edge" x1="470" y1="170" x2="740" y2="230"/>

  <!-- unlock dependency -->
  <path class="dep" d="M622 352 Q 738 342 742 256"/>
  <polygon class="f-locked" points="742,253 736,266 748,266"/>
  <text class="sub t-locked" x="762" y="320">inspected</text>
  <text class="sub t-locked" x="762" y="336">opens it</text>

  <!-- edge weights (flight cost = distance) -->
  <circle class="wbg" cx="240" cy="330" r="12"/><text class="w" x="240" y="334.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="450" cy="385" r="12"/><text class="w" x="450" y="389.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="535" cy="265" r="12"/><text class="w" x="535" y="269.5" text-anchor="middle">1</text>
  <circle class="wbg" cx="605" cy="200" r="12"/><text class="w" x="605" y="204.5" text-anchor="middle">1</text>

  <!-- hospital_viladecans (delivery) -->
  <circle class="node mission" cx="90" cy="330" r="21"/>
  <path class="s-mission" d="M90 320 v20 M80 330 h20" stroke-width="5"/>
  <text class="lbl" x="90" y="376" text-anchor="middle">hospital_viladecans</text>
  <text class="sub t-mission" x="90" y="392" text-anchor="middle">needs kit1</text>

  <!-- aerodrome (depot, kit1 here) -->
  <rect class="node depot" x="279" y="309" width="42" height="42" rx="6"/>
  <rect class="f-depot" x="291" y="321" width="18" height="18" rx="2"/>
  <text class="lbl" x="300" y="376" text-anchor="middle">aerodrome</text>
  <text class="sub" x="300" y="392" text-anchor="middle">depot · kit1</text>

  <!-- barceloneta (inspect) -->
  <circle class="node mission" cx="600" cy="360" r="21"/>
  <polygon points="600,349 610,368 590,368" fill="none" class="s-mission" stroke-width="3"/>
  <text class="lbl" x="600" y="406" text-anchor="middle">barceloneta</text>
  <text class="sub t-mission" x="600" y="422" text-anchor="middle">inspect</text>

  <!-- montjuic_pad (charger) -->
  <circle class="node charger" cx="470" cy="170" r="21"/>
  <polygon class="f-charger" points="474,156 462,173 470,173 466,185 478,167 470,167"/>
  <text class="lbl" x="470" y="130" text-anchor="middle">montjuic_pad</text>
  <text class="sub" x="470" y="146" text-anchor="middle">hilltop charger</text>

  <!-- ciutadella (locked, inspect) -->
  <circle class="node locked" cx="740" cy="230" r="21"/>
  <rect class="f-locked" x="732" y="229" width="16" height="12" rx="2"/>
  <path class="s-locked" d="M735 229 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke-width="2.5"/>
  <text class="lbl" x="772" y="226">ciutadella</text>
  <text class="sub t-locked" x="772" y="242">locked · inspect</text>

  <!-- drone start badge (capacity b4, starts full) -->
  <rect class="badge" x="271" y="270" width="58" height="26" rx="5"/>
  <text class="badge-t" x="300" y="288" text-anchor="middle">A b4</text>

  <!-- legend (vertical, right of the map) -->
  <g transform="translate(900,76)">
    <rect x="0" y="0" width="348" height="400" rx="10" fill="#fafbfa" stroke="#d5dcd9" stroke-width="1.5"/>
    <g transform="translate(0,33.75) scale(1.45)">
      <rect class="node depot" x="13" y="-11" width="22" height="22" rx="4" style="stroke-width:2.5"/>
      <rect class="f-depot" x="19" y="-5" width="10" height="10" rx="1"/>
      <text class="sub" x="50" y="4.5">depot (supplies start here)</text>
    </g>
    <g transform="translate(0,81.25) scale(1.45)">
      <circle class="node charger" cx="24" cy="0" r="11" style="stroke-width:2.5"/>
      <polygon class="f-charger" points="26,-8 19,2 24,2 22,9 29,-1 24,-1"/>
      <text class="sub" x="50" y="4.5">charging station</text>
    </g>
    <g transform="translate(0,128.75) scale(1.45)">
      <circle class="node mission" cx="24" cy="0" r="11" style="stroke-width:2.5"/>
      <polygon points="24,-6 30,5 18,5" fill="none" class="s-mission" stroke-width="2"/>
      <text class="sub" x="50" y="4.5">inspection site</text>
    </g>
    <g transform="translate(0,176.25) scale(1.45)">
      <circle class="node mission" cx="24" cy="0" r="11" style="stroke-width:2.5"/>
      <path class="s-mission" d="M24 -6 v12 M18 0 h12" stroke-width="3"/>
      <text class="sub" x="50" y="4.5">delivery site (needs supply)</text>
    </g>
    <g transform="translate(0,223.75) scale(1.45)">
      <circle class="node locked" cx="24" cy="0" r="11" style="stroke-width:2"/>
      <rect class="f-locked" x="20" y="0" width="8" height="6" rx="1"/>
      <path class="s-locked" d="M21.5 0 v-3 a2.5 2.5 0 0 1 5 0 v3" fill="none" stroke-width="1.5"/>
      <text class="sub" x="50" y="4.5">locked at the start</text>
    </g>
    <g transform="translate(0,271.25) scale(1.45)">
      <path class="dep" d="M8 0 h24"/>
      <polygon class="f-locked" points="40,0 30,-5 30,5"/>
      <text class="sub" x="50" y="4.5">unlocks a locked site</text>
    </g>
    <g transform="translate(0,318.75) scale(1.45)">
      <line class="edge" x1="8" y1="0" x2="40" y2="0"/>
      <circle class="wbg" cx="24" cy="0" r="10"/><text class="w" x="24" y="4.5" text-anchor="middle">2</text>
      <text class="sub" x="50" y="4.5">flight cost = distance</text>
    </g>
    <g transform="translate(0,366.25) scale(1.45)">
      <rect class="badge" x="2" y="-11" width="44" height="22" rx="4"/>
      <text class="badge-t" x="24" y="4.5" text-anchor="middle">A b4</text>
      <text class="sub" x="54" y="4.5">drone start, battery</text>
    </g>
  </g>
</svg>
